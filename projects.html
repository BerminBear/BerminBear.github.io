<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | Benjamin D. Natalli — Audio Design &amp; Composition</title>
    <meta name="description" content="Explore game audio, sound design, and music composition projects by Benjamin D. Natalli. Featuring work on Tentacle Tango, Aura Farmers, HULDR, and more.">
    <meta name="author" content="Benjamin D. Natalli">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://berminbear.github.io/projects.html">
    <meta name="theme-color" content="#08070a">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;700&family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;500;600;700;800&family=EB+Garamond:ital,wght@0,400;0,700;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        .code-font { font-family: 'Fira Code', monospace; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>

<body class="bg-[var(--color-bg)] text-[var(--color-text)] antialiased" data-page="projects">
    <canvas id="bg-particles" aria-hidden="true" class="fixed inset-0 w-full h-full pointer-events-none z-0"></canvas>

    <!-- HEADER / DRAWER -->
    <header id="site-header"></header>

    <!-- PROJEKT-LANES -->
    <main class="pt-20 pb-20 px-4 sm:px-8 lg:px-14 relative z-10 max-w-[1680px] mx-auto">
        <div class="lanes-wrapper flex flex-col gap-6">

            <!-- LANE 1: GAMES -->
            <section id="studio-games" class="project-lane relative group scroll-mt-24 pt-1" style="overflow-anchor: none;">
                <h3 class="lane-heading relative z-10 m-0 mb-5">Games</h3>

                <div class="flex items-stretch gap-2 sm:gap-3 relative z-20">
                    <button type="button"
                            class="carousel-prev lane-wing shrink-0 w-7 sm:w-8 flex items-center justify-center font-mono text-base sm:text-lg"
                            aria-label="Scroll games left">
                        &lt;
                    </button>

                    <div class="lane-track flex-1 flex overflow-x-auto snap-x snap-mandatory scroll-smooth pt-2 pb-8 hide-scrollbar px-2"
                         data-project-ids="tentacle-tango,skeletons,aura-farmers,rubik-road,crocodine"
                         data-media-class="aspect-video">
                    </div>

                    <button type="button"
                            class="carousel-next lane-wing shrink-0 w-7 sm:w-8 flex items-center justify-center font-mono text-base sm:text-lg"
                            aria-label="Scroll games right">
                        &gt;
                    </button>
                </div>
            </section>

            <!-- LANE 2: FILM -->
            <section id="cinematic" class="project-lane relative group scroll-mt-24 pt-1" style="overflow-anchor: none;">
                <h3 class="lane-heading relative z-10 m-0 mb-5">Film</h3>

                <div class="flex items-stretch gap-2 sm:gap-3 relative z-20">
                    <button type="button"
                            class="carousel-prev lane-wing shrink-0 w-7 sm:w-8 flex items-center justify-center font-mono text-base sm:text-lg"
                            aria-label="Scroll film projects left">
                        &lt;
                    </button>

                    <div class="lane-track flex-1 flex overflow-x-auto snap-x snap-mandatory scroll-smooth pt-2 pb-8 hide-scrollbar px-2"
                         data-project-ids="huldr,retusch"
                         data-media-class="aspect-video">
                    </div>

                    <button type="button"
                            class="carousel-next lane-wing shrink-0 w-7 sm:w-8 flex items-center justify-center font-mono text-base sm:text-lg"
                            aria-label="Scroll film projects right">
                        &gt;
                    </button>
                </div>
            </section>

        </div>
    </main>

    <!-- PROJECT MODAL -->
    <div id="project-detail-modal" class="fixed inset-0 z-[10001] bg-black/75 backdrop-blur-sm hidden transition-opacity duration-300 opacity-0 flex items-center justify-center p-4 md:p-8">
        <div id="project-modal-wrapper" class="card-surface p-6 md:p-10 max-w-5xl w-full transform scale-95 transition-all duration-300 relative overflow-y-auto max-h-[90vh]">
            <button type="button" onclick="closeProjectModal()" class="absolute top-4 right-4 z-10 w-8 h-8 flex items-center justify-center rounded-full bg-[var(--color-secondary)] border border-[var(--color-accent-border)] text-xl leading-none">&times;</button>
            <div id="project-modal-body"></div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
