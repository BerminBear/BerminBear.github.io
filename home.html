<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benjamin D.Natalli | Technical Audio &amp; Dialogue Designer</title>



    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;500;600;700;800&family=EB+Garamond:ital,wght@0,400;0,700;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-[var(--color-bg)] text-[var(--color-text)] antialiased" data-page="home">
    <canvas id="bg-particles" aria-hidden="true" class="fixed inset-0 w-full h-full pointer-events-none z-0"></canvas>

        <!-- EXPANDED / CENTERED SHOWREEL VIEW -->
    <div id="showreel-lightbox" class="showreel-lightbox" role="dialog" aria-modal="true" aria-label="Expanded showreel" aria-hidden="true">
        <div class="showreel-lightbox-inner">
            <button type="button" id="close-showreel-lightbox" class="showreel-expand-btn" aria-label="Close expanded showreel">
                [ Minimize / ESC ]
            </button>
            <video id="expanded-showreel-video" class="w-full h-full object-contain bg-black" playsinline controls preload="metadata">
                <source src="videos/splash-reel.mp4" type="video/mp4">
            </video>
        </div>
    </div>

    <!-- NAVBAR -->
    <header id="site-header"></header>

    <!-- MAIN CONTENT -->
<main class="w-full max-w-[1680px] mx-auto px-4 sm:px-6 lg:px-8 pt-20 md:pt-45 lg:pt-45 pb-12 lg:pb-16 relative z-20 min-h-screen flex items-center">
     <section id="hero" class="w-full grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-10 items-center lg:items-stretch">

            <!-- LEFT COLUMN -->
            <div id="hero-text-col" class="order-2 lg:order-1 lg:col-span-5 flex flex-col lg:justify-center gap-5 items-center text-center animate-fade-up" style="animation-delay: 0.1s; animation-duration: 2.1s;">
                <button type="button" onclick="openAboutModal()" class="group cv-name-trigger flex flex-col items-center justify-center focus:outline-none relative">
                    <div class="relative flex items-center justify-center">
                        <h1 class="heading-display mb-0 flex items-center gap-3">
                            <span>Benjamin</span>
                            <span class="tracking-[0.04em]">Natalli</span>
                        </h1>
                        <span class="name-ribbon absolute left-full ml-4 whitespace-nowrap hidden sm:inline-flex pointer-events-none">
                            About
                        </span>
                    </div>

                    <!-- SVG Divider
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 40" class="name-divider w-full max-w-[360px] -mt-1" aria-hidden="true">
                        <polygon points="0,20 200,18.5 200,21.5" fill="currentColor" />
                        <polygon points="490,20 300,18.5 300,21.5" fill="currentColor" />
                        <polygon points="250,10 260,20 250,30 240,20" fill="none" stroke="currentColor" stroke-width="1.5" />
                        <polygon points="250,14 256,20 250,26 244,20" fill="currentColor" />
                        <circle cx="230" cy="20" r="1.5" fill="currentColor" />
                        <circle cx="270" cy="20" r="1.5" fill="currentColor" />
                        <polygon points="212,20 220,16 228,20 220,24" fill="none" stroke="currentColor" stroke-width="1.2" />
                        <polygon points="288,20 280,16 272,20 280,24" fill="none" stroke="currentColor" stroke-width="1.2" />
                    </svg>-->
                </button>

                <div>
                    <h2 class="heading-sub text-sm md:text-[15px] mb-2 tracking-widest">
                        Technical Audio &amp; Dialogue Designer
                    </h2>

                    <p class="medieval-meta text-[13px] md:text-[14px] leading-relaxed font-semibold">
                        5 Released games <span class="text-[var(--color-muted)] mx-1">·</span> 2 shortfilms <span class="text-[var(--color-muted)] mx-1">·</span> 4+ years of experience
                    </p>
                </div>

                <!-- LINKS -->
                <div class="w-full grid grid-cols-2 sm:grid-cols-4 gap-1.5 label-mono text-xs sm:text-[12px] font-semibold">
                    <button type="button" onclick="openAboutModal()" class="nav-link py-2 px-2 rounded bg-[var(--color-modal-bg)] border border-[var(--color-accent-border)] focus:outline-none">About</button>
                    <a href="https://www.linkedin.com/in/benji-natalli-salmonsson-791188290/" target="_blank" rel="noopener noreferrer" class="nav-link py-2 px-2 rounded bg-[var(--color-modal-bg)] border border-[var(--color-accent-border)]">LinkedIn</a>
                    <a href="mailto:Benjamin.Salmonsson@outlook.com" class="nav-link py-2 px-2 rounded bg-[var(--color-modal-bg)] border border-[var(--color-accent-border)]">Email</a>
                    <a href="Benjamin-Natalli-CV.pdf" download class="nav-link py-2 px-2 rounded bg-[var(--color-modal-bg)] border border-[var(--color-accent-border)]">CV</a>
                </div>

                <!-- DIVIDER
                <div class="w-full flex items-center gap-3 opacity-65" aria-hidden="true">
                    <span class="h-[1px] flex-1 bg-[var(--color-accent-border)]"></span>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 12" class="w-5 h-3 text-[var(--color-accent)]">
                        <polygon points="12,1 18,6 12,11 6,6" fill="none" stroke="currentColor" stroke-width="1.3" />
                    </svg>
                    <span class="h-[1px] flex-1 bg-[var(--color-accent-border)]"></span>
                </div> -->

                <!-- TECH STACK -->
                <div id="tech-stack-icons" class="w-full"></div>

                <!-- DIVIDER -->
                <div class="w-full flex items-center gap-3 opacity-65" aria-hidden="true">
                    <span class="h-[1px] flex-1 bg-[var(--color-accent-border)]"></span>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 12" class="w-5 h-3 text-[var(--color-accent)]">
                        <polygon points="12,1 18,6 12,11 6,6" fill="none" stroke="currentColor" stroke-width="1.3" />
                    </svg>
                    <span class="h-[1px] flex-1 bg-[var(--color-accent-border)]"></span>
                </div>

                <!-- HIGHLIGHTS (Fylls av JS) -->
                <div id="highlights" class="w-full grid grid-cols-1 sm:grid-cols-2 gap-4" data-media-class="aspect-video">
                    <!-- JavaScript fyller denna automatiskt -->
                </div>

                <!-- VIEW ALL PROJECTS -->
                <div class="w-full mt-4">
                    <a href="projects.html" class="view-all-btn medieval-cta no-transform flex items-center justify-center w-full px-8 py-3.5 rounded-md border border-[var(--color-accent-border)] card-surface uppercase text-xs font-bold">
                        View all projects →
                    </a>
                </div>
            </div>

            <!-- RIGHT COLUMN: SHOWCASE -->
            <div id="hero-stage-col" class="order-1 lg:order-2 lg:col-span-7 w-full lg:sticky lg:top-8 flex flex-col lg:h-full animate-fade-up" style="animation-delay: 0.75s; animation-duration: 2.3s;">
                <div class="grid grid-cols-5 items-end text-center shrink-0" role="tablist" aria-label="Showcase modes">
                    <button type="button" data-stage-mode="showreel" class="stage-tab is-active focus:outline-none">Showreel</button>
                    <button type="button" data-stage-mode="music" class="stage-tab focus:outline-none">Music</button>
                    <button type="button" data-stage-mode="dialogue" class="stage-tab focus:outline-none">Dialogue</button>
                    <button type="button" data-stage-mode="sound" class="stage-tab focus:outline-none">Sound Design</button>
                    <button type="button" data-stage-mode="tools" class="stage-tab focus:outline-none">Tools</button>
                </div>

                <div id="showcase-stage" class="h-[360px] sm:h-[520px] lg:h-auto lg:flex-1 w-full overflow-hidden stage-panel relative z-20 p-4 sm:p-7 flex flex-col justify-center"></div>
            </div>
        </section>
    </main>

    <!-- ABOUT MODAL -->
    <div id="about-detail-modal" class="fixed inset-0 bg-black/75 backdrop-blur-md z-[10001] hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4">
        <div id="about-modal-wrapper" class="card-surface p-6 md:p-10 max-w-4xl w-full transform scale-95 transition-all duration-300 relative overflow-y-auto max-h-[90vh]">
            <button type="button" onclick="closeAboutModal()" class="absolute top-4 right-4 label-mono text-xs text-[var(--color-muted)] uppercase tracking-widest">[ CLOSE / ESC ]</button>
            <div id="about-modal-body"></div>
        </div>
    </div>

    <!-- PROJECT MODAL -->
    <div id="project-detail-modal" class="fixed inset-0 z-[10001] bg-black/75 backdrop-blur-sm hidden transition-opacity duration-300 opacity-0 flex items-center justify-center p-4 md:p-8">
        <div id="project-modal-wrapper" class="card-surface p-6 md:p-10 max-w-5xl w-full transform scale-95 transition-all duration-300 relative overflow-y-auto max-h-[90vh]">
            <button type="button" onclick="closeProjectModal()" class="absolute top-4 right-4 z-10 w-8 h-8 flex items-center justify-center rounded-full bg-[var(--color-secondary)] border border-[var(--color-accent-border)] text-xl leading-none">&times;</button>
            <div id="project-modal-body"></div>
        </div>
    </div>

    <div id="mini-audio-bar" class="mini-player-bar" role="region" aria-label="Active audio controls">
        <button
            type="button"
            id="mini-play-toggle"
            class="label-mono text-[11px] uppercase tracking-wider px-2.5 py-1 rounded border border-[var(--color-accent-border)] text-[var(--color-accent-hover)] shrink-0"
        >
            Pause
        </button>
        <button
            type="button"
            id="mini-mute-toggle"
            class="label-mono text-[11px] uppercase tracking-wider px-2 py-1 rounded border border-[var(--color-accent-border)] text-[var(--color-accent-hover)] shrink-0"
            aria-pressed="false"
            title="Mute or unmute active track"
        >
            Mute
        </button>
        <span id="mini-track-title" class="text-xs sm:text-sm font-medium truncate max-w-[140px] sm:max-w-[200px]" style="font-family: 'Plus Jakarta Sans', sans-serif;">
            —
        </span>

        <span class="h-4 w-[1px] bg-[var(--color-accent-border)] shrink-0 mx-0.5" aria-hidden="true"></span>

        <div class="flex items-center gap-1.5 shrink-0">
            <button
                type="button"
                id="toggle-particles-btn"
                class="label-mono text-[10px] uppercase tracking-wider px-2 py-1 rounded border border-[var(--color-accent-border)] text-[var(--color-accent-hover)]"
                aria-pressed="true"
                title="Toggle background stars"
            >
                Stars: On
            </button>
            <button
                type="button"
                id="toggle-ui-btn"
                class="label-mono text-[10px] uppercase tracking-wider px-2 py-1 rounded border border-[var(--color-accent-border)] text-[var(--color-accent-hover)]"
                aria-pressed="false"
                title="Hide interface"
            >
                Hide UI
            </button>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
