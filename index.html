<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benjamin Natalli | Cinematic Intro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <!-- Nya Fonter -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=EB+Garamond:ital,wght@0,400;0,700;1,400&family=IM+Fell+Double+Pica:ital@0;1&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#030303] text-white flex items-center justify-center h-screen overflow-hidden transition-opacity duration-1000">

<!-- SKIP-KNAPP I HÖRNET (Garamond + SVG) -->
    <a href="home.html" id="skip-top-btn" class="absolute top-8 right-8 font-garamond text-xl text-white/50 hover:text-[var(--color-accent-hover)] transition-all duration-1000 opacity-0 pointer-events-none z-50 flex flex-col items-center gap-1">
        <span>Skip Intro</span>
        <!-- Liten elegant pil/linje SVG -->
        <svg width="30" height="6" viewBox="0 0 30 6" fill="none" xmlns="http://www.w3.org/2000/svg" class="opacity-70">
            <path d="M1 3H29L25 1M29 3L25 5" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </a>

    <!-- PiP-KNAPP I HÖGRA BOTTENHÖRNET -->
    <button id="pip-btn" class="absolute bottom-8 right-8 text-white/40 hover:text-white transition-opacity duration-1000 opacity-0 pointer-events-none z-50 p-2 rounded-md hover:bg-white/10" aria-label="Picture in Picture">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2" ry="2"></rect>
            <rect x="12" y="11" width="7" height="6" rx="1" ry="1"></rect>
        </svg>
    </button>
<!-- HUVUDCONTAINER -->
<div id="splash-container" class="flex flex-col items-center justify-center text-center px-6 max-w-4xl transition-opacity duration-1000 z-10 relative">
<!-- Byt ut font-serif mot font-garamond -->
<p class="font-garamond text-2xl sm:text-3xl md:text-4xl tracking-wide mb-12 text-white/90 whitespace-nowrap">
    <span id="text-part-1" class="opacity-0 transition-opacity duration-1000">Would you like...</span>
    <span id="text-part-2" class="opacity-0 transition-opacity duration-1000 ml-2">to listen?</span>
</p>
    
    <div id="splash-buttons" class="flex gap-8 items-center justify-center opacity-0 transition-opacity duration-1000">
        <button id="listen-btn" class="font-mono text-sm uppercase tracking-widest text-white/80 hover:text-[var(--color-accent-hover)] transition-colors cursor-pointer focus:outline-none">
            [ Listen ]
        </button>
        <a href="home.html" id="skip-link-btn" class="font-mono text-sm uppercase tracking-widest text-white/60 hover:text-[var(--color-accent-hover)] transition-colors focus:outline-none">
            [ Skip ]
        </a>
    </div>
</div>
    <!-- VIDEO CONTAINER (Dold från start) -->
    <div id="video-container" class="fixed inset-0 bg-[#030303] z-40 opacity-0 pointer-events-none transition-opacity duration-1000 flex items-center justify-center">
        <!-- Byt ut src mot din highlight reel -->
        <video id="splash-video" class="w-full h-full object-cover" playsinline preload="auto">
            <source src="videos/splash-reel.mp4" type="video/mp4">
        </video>
    </div>

    <script type="module" src="js/splash.js"></script>
</body>
</html>
